<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror App</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    transform: scaleX(-1);
  }

  .controls {
    position: fixed;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    background: white;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.9;
  }

  .status {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 14px;
  }
</style>
</head>

<body>

<div class="status" id="status">Initializing camera...</div>

<video id="camera" autoplay playsinline></video>

<div class="controls">
  <button onclick="toggleCamera()">Switch</button>
  <button onclick="takePhoto()">Snap</button>
</div>

<script>
let currentFacing = "user";
let stream;

async function startCamera() {
  const status = document.getElementById("status");

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacing },
      audio: false
    });

    const video = document.getElementById("camera");
    video.srcObject = stream;

    // Mirror only for front camera
    video.style.transform = currentFacing === "user" ? "scaleX(-1)" : "scaleX(1)";

    status.innerText = currentFacing === "user" ? "Front Camera (Mirror)" : "Back Camera";
  } catch (err) {
    status.innerText = "Camera access denied";
  }
}

function toggleCamera() {
  currentFacing = currentFacing === "user" ? "environment" : "user";
  startCamera();
}

function takePhoto() {
  const video = document.getElementById("camera");

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");

  // 🔥 KEY CHANGE: Save REAL image (no mirror)
  ctx.drawImage(video, 0, 0);

  const img = canvas.toDataURL("image/png");

  const a = document.createElement("a");
  a.href = img;
  a.download = "real-photo.png";
  a.click();
}

window.onload = startCamera;
</script>

  
</body>
</html>
